name: Android build & tests

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Only APKs that can actually sign in to Spotify are published.
      HAS_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core + app)
        run: ./gradlew test --console=plain

      - name: Build APKs
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          GETSONGBPM_API_KEY: ${{ secrets.GETSONGBPM_API_KEY }}
          APP_APPLICATION_ID: ${{ vars.APP_APPLICATION_ID }}
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            export ANDROID_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
            export ANDROID_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"
          fi
          ./gradlew :app:assembleDebug :app:assembleRelease --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/SpotifyMe.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SpotifyMe-android-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk

      - name: Warn when the Client ID secret is missing
        if: env.HAS_CLIENT_ID != 'true'
        run: echo "::warning::SPOTIFY_CLIENT_ID secret is not set, so the APK cannot sign in and no release is published."

      # Every push to main becomes the latest GitHub Release, so
      # https://github.com/<owner>/<repo>/releases/latest/download/SpotifyMe.apk always gets the newest build.
      - name: Publish GitHub Release (sideload APK)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_CLIENT_ID == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: SpotifyMe for Android, build ${{ github.run_number }}
          make_latest: "true"
          files: app/build/outputs/apk/debug/SpotifyMe.apk
          body: |
            **Install:** open this page on your Android phone, tap `SpotifyMe.apk`, then open the download.
            Allow "Install unknown apps" for your browser when asked. Newer builds install over older ones.

            Built from ${{ github.sha }}.

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: "**/build/reports/tests/"
